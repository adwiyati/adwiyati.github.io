<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>أدويتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14504f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — sticky header with the next dose, scrolling list, fixed bottom tab bar. Pharmacy-label feel. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#e8eeea; --ink:#16231f; --muted:#5d6d67; --line:#d5ddd8;
  --teal:#14504f; --teal-ink:#ffffff; --teal-soft:#d9ebe7;
  --amber:#c46a12; --amber-soft:#fbe9d4; --ok:#2f7d4a; --ok-soft:#dcefe2; --bad:#b23a3a; --bad-soft:#f6dddd;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17221f; --surface-2:#1f2d29; --ink:#e6eeea; --muted:#9aaba5; --line:#2b3a36;
  --teal:#5fb3a8; --teal-ink:#0b1513; --teal-soft:#1c3531; --amber:#f0a14d; --amber-soft:#3a2a17;
  --ok:#6cc58a; --ok-soft:#183223; --bad:#ef7d7d; --bad-soft:#3a1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17221f; --surface-2:#1f2d29; --ink:#e6eeea; --muted:#9aaba5; --line:#2b3a36;
  --teal:#5fb3a8; --teal-ink:#0b1513; --teal-soft:#1c3531; --amber:#f0a14d; --amber-soft:#3a2a17;
  --ok:#6cc58a; --ok-soft:#183223; --bad:#ef7d7d; --bad-soft:#3a1d1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--teal)}
#app{min-height:100vh;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--teal);color:var(--teal-ink)}
.top .wrap{padding-block:14px 16px;display:grid;gap:10px}
.hello{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hello h1{font-size:1.25rem}
.hello small{opacity:.85;font-size:.85rem}
.next{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border-radius:var(--r);padding:10px 12px}
:root[data-theme="dark"] .next{background:rgba(0,0,0,.15)}
.next .pill{flex:none}
.next b{font-family:var(--f-display);font-weight:600;display:block}
.next span{font-size:.85rem;opacity:.9}
.next .cd{margin-inline-start:auto;font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.sound-warn{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--amber);color:#fff;border-radius:10px;padding:8px 12px;font-size:.9rem}
.sound-warn button{background:#fff;color:var(--amber);border:0;border-radius:8px;padding:6px 12px;font-weight:600}

/* sections */
main .wrap{padding-block:18px;display:grid;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-head h2{font-size:1.15rem}
.label{font-size:.78rem;letter-spacing:.02em;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.empty{text-align:center;color:var(--muted);padding:28px 14px;border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);margin-bottom:4px}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--teal);color:var(--teal-ink);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:8px}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* dose timeline */
.dose{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-inline-start:5px solid var(--line)}
.dose .time{font-family:var(--f-display);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums;min-width:4.6em;text-align:center;line-height:1.2}
.dose .time small{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.dose .info{min-width:0}
.dose .info b{font-family:var(--f-display);font-weight:600;display:block;overflow-wrap:anywhere}
.dose .info span{color:var(--muted);font-size:.88rem;display:block}
.dose .info span.chip{display:inline-block;width:auto;margin-inline-start:4px;vertical-align:middle}
.dose .acts{display:flex;gap:6px}
.dose.taken{border-inline-start-color:var(--ok);opacity:.75}
.dose.skipped{border-inline-start-color:var(--muted);opacity:.6}
.dose.missed{border-inline-start-color:var(--bad)}
.dose.due{border-inline-start-color:var(--amber);background:var(--amber-soft)}
.dose.upcoming{border-inline-start-color:var(--teal)}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.amb{background:var(--amber-soft);color:var(--amber)}
.chip.mut{background:var(--surface-2);color:var(--muted)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}

/* prescriptions & doctors */
.rx{display:grid;gap:10px}
.rx-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rx-head h3{font-size:1.02rem}
.rx-head p{margin:0;color:var(--muted);font-size:.88rem}
.med{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--surface-2)}
.med b{font-family:var(--f-display);font-weight:600;overflow-wrap:anywhere}
.med .sub{font-size:.85rem;color:var(--muted)}
.med .times{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.doc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.doc b{font-family:var(--f-display);font-weight:600}
.doc .sub{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.icon-btn{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

.dz{font-family:var(--f-body);font-weight:500;font-size:.74rem;color:var(--teal);background:var(--teal-soft);padding:1px 8px;border-radius:99px;margin-inline-start:4px;white-space:nowrap;vertical-align:middle}
.alarm-dz{font-size:1.1rem;opacity:.9}
/* author's dedication */
.gift{display:grid;justify-items:center;gap:4px;text-align:center;padding:16px 12px 6px;color:var(--muted)}
.gift svg{color:var(--bad);opacity:.85}
.gift p{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.6;color:var(--ink)}
.gift span{font-size:.9rem;letter-spacing:.02em}

/* monthly reports */
.rep{display:grid;gap:12px}
.rep-head{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rep-head:focus-visible{outline:3px solid var(--amber);outline-offset:4px;border-radius:8px}
.rep-head h3{font-size:1.1rem}
.rep-head .sub,.rep .sub{display:block;color:var(--muted);font-size:.86rem}
.rep:not(.open) .rep-head h3{font-size:1rem}
.rep-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.rep-stats div{background:var(--surface-2);border-radius:10px;padding:8px 4px;display:grid}
.rep-stats b{font-family:var(--f-display);font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}
.rep-stats span{font-size:.75rem;color:var(--muted)}
.rep-sec{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.rep-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.rep-date{font-family:var(--f-display);font-weight:600;font-size:.85rem;background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:4px 8px;text-align:center;min-width:4.2em}
.rep-body{min-width:0}
.rep-body b,.rep-doc b{font-family:var(--f-display);font-weight:600}
.rep-body .times{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rep-doc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.rep-doc .avatar{width:36px;height:36px;font-size:.95rem}

/* tab bar */
.tabs{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs button{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;align-content:center;gap:2px;font-size:.78rem;font-weight:500}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--teal);font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:1.2rem}
.field{display:grid;gap:4px}
.field label{font-size:.88rem;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:46px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.times-edit{display:flex;flex-wrap:wrap;gap:8px}
.times-edit{flex-direction:column;align-items:stretch}
.times-edit .t{display:flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:6px 8px;direction:ltr;justify-content:flex-end}
.times-edit .t .tn{margin-inline-end:auto;color:var(--muted);font-size:.85rem;direction:rtl}
.times-edit .t select{font-family:var(--f-display);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums;min-height:48px;padding:4px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.times-edit .t select[data-p="ap"]{font-size:1rem;direction:rtl}
.times-edit .t b{font-size:1.3rem}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:4px 12px;font-size:.85rem}
.presets.seg button{padding:8px 14px;font-weight:500}
.lang-sw button{min-width:96px}
.presets button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.err{color:var(--bad);font-size:.88rem;margin:0}
.hint{color:var(--muted);font-size:.85rem;margin:0}

/* alarm */
.alarm{position:fixed;inset:0;z-index:60;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));text-align:center}
.alarm .box{display:grid;gap:14px;justify-items:center;max-width:420px;width:100%}
.ring{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 18px rgba(255,255,255,.08)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
.alarm h2{font-size:clamp(2.4rem,11vw,3.4rem);line-height:1.15;overflow-wrap:anywhere}
.alarm .dosebig{font-size:clamp(1.5rem,7vw,2rem);font-weight:700;background:rgba(255,255,255,.18);padding:8px 22px;border-radius:99px}
.alarm .meta{opacity:.9;font-size:1.2rem}
.alarm .label{font-size:1.1rem!important}
.alarm .btns{display:grid;gap:10px;width:100%;margin-top:8px}
.alarm .btn{padding:14px;font-size:1.05rem}
.alarm .btn.take{background:#fff;color:var(--teal)}
:root[data-theme="dark"] .alarm .btn.take{background:var(--teal-ink);color:var(--teal)}
.alarm .btn.alt{background:rgba(255,255,255,.16);color:inherit}
.alarm .more{font-size:.9rem;opacity:.85}

.toast{position:fixed;inset-inline:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);z-index:50;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.set-list{display:grid;gap:0}
.set-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-item:last-child{border-bottom:0}
.set-item div{min-width:0}
.set-item b{display:block;font-weight:600}
.set-item small{color:var(--muted);display:block;line-height:1.4}
.switch{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;cursor:pointer;border:0}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.switch:checked{background:var(--teal)}
.switch:checked::after{inset-inline-start:23px}
textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;direction:ltr;text-align:left;min-height:120px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:grid;gap:4px;justify-items:center;font-size:.72rem;color:var(--muted)}
.week i{width:100%;max-width:34px;aspect-ratio:1;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-size:.75rem;font-weight:600;color:var(--ink)}
.week i.full{background:var(--ok);color:#fff}
.week i.part{background:var(--amber-soft);color:var(--amber)}
.week i.none{background:var(--bad-soft);color:var(--bad)}
</style>

</head><body>
<div id="app" dir="rtl" lang="ar">
  <header class="top"><div class="wrap" id="top"></div></header>
  <main><div class="wrap" id="view"></div></main>
  <nav class="tabs" aria-label="التنقل"><div class="in" id="tabs"></div></nav>
</div>
<div id="layer"></div>

<script>
(function(){
"use strict";


/* ---------- storage ---------- */
const KEY="dawa.v1";
const APP_VERSION="2.3";
const blank=()=>({profile:{name:""},doctors:[],rx:[],meds:[],log:{},prn:[],settings:{speech:true,volume:0.8,snooze:10,wake:false,tone:"chime",voiceURI:"",gender:"female"}});
let S=blank();
function load(){try{const t=localStorage.getItem(KEY);if(t){S=Object.assign(blank(),JSON.parse(t));S.settings=Object.assign(blank().settings,S.settings||{});}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast(""+T("تعذّر الحفظ على هذا الجهاز")+"");} scheduleNativeSoon();}

/* ---------- Android app: phone alarms that ring while the app is closed ---------- */
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const LN=NATIVE&&window.Capacitor.Plugins?window.Capacitor.Plugins.LocalNotifications:null;
const IS_ANDROID=/Android/i.test(navigator.userAgent), IS_IOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
const APK_URL="https://github.com/adwiyati/adwiyati-android/releases/latest/download/adwiyati.apk";
const hid=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>1)%2000000000+1;};
let schedT=null, nativeReady=false, exactOK=true;
// Android 12+: alarms ring at the exact minute only when "Alarms & reminders" is allowed for the app.
async function checkExact(){ if(!LN||!LN.checkExactNotificationSetting) return; try{ const r=await LN.checkExactNotificationSetting(); exactOK=r.exact_alarm==="granted"; }catch(e){} }
async function askExact(){ try{ await LN.changeExactNotificationSetting(); }catch(e){} setTimeout(async()=>{ await checkExact(); render(); scheduleNativeSoon(); },800); }
function scheduleNativeSoon(){ if(!LN) return; clearTimeout(schedT); schedT=setTimeout(scheduleNative,700); }
async function nativeSetup(){
  if(!LN) return;
  try{
    let p=await LN.checkPermissions(); if(p.display!=="granted") p=await LN.requestPermissions();
    for(const g of ["f","m","en_f","en_m"]) await LN.createChannel({id:"alarm_"+g,name:(g.endsWith("f")?""+T("منبّه الدواء - صوت نسائي")+"":""+T("منبّه الدواء - صوت رجالي")+"")+(g.startsWith("en")?" (EN)":""),
      description:""+T("تنبيهات مواعيد الأدوية")+"",importance:5,visibility:1,sound:"voice_"+g+".mp3",vibration:true,lights:true,lightColor:"#14504F"});
    LN.addListener("localNotificationActionPerformed",()=>{ render(); setTimeout(checkDue,400); });
    await checkExact(); nativeReady=true; scheduleNative(); render();
  }catch(e){ console.warn("native setup",e); }
}
// Schedules the next 14 days of doses, plus a follow-up 15 minutes after each one in case it isn't recorded.
// Called after every change, so a dose marked taken or skipped loses its pending alarms.
async function scheduleNative(){
  if(!LN||!nativeReady) return;
  try{
    const pend=await LN.getPending(); if(pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=[], now=Date.now(), ch="alarm_"+(LANG==="en"?"en_":"")+(wantMale()?"m":"f"), DAYS=14;
    for(let i=0;i<DAYS&&list.length<440;i++){ const k=addDays(today(),i); const [y,mo,da]=k.split("-").map(Number);
      dosesFor(k).forEach(d=>{ if(d.status) return; const [h,mi]=d.time.split(":").map(Number); const at=new Date(y,mo-1,da,h,mi,0);
        const food=FOOD[d.med.food||""]; const body=`${d.med.name}${d.med.dose?" — "+d.med.dose:""}${food?" · "+food:""}`;
        const base={body,largeBody:body,channelId:ch,smallIcon:"ic_stat_pill",iconColor:"#14504F",extra:{key:d.key}};
        if(at.getTime()>now) list.push({...base,id:hid(d.key),title:"💊 "+T("حان موعد الدواء")+"",schedule:{at,allowWhileIdle:true}});
        const f=new Date(at.getTime()+15*60000); if(f.getTime()>now) list.push({...base,id:hid(d.key+"|f"),title:"⏰ "+T("تذكير: لم تُسجَّل الجرعة بعد")+"",schedule:{at:f,allowWhileIdle:true}});
      });
    }

function medActiveOn(m,k){
  if(m.paused) return false;
  if(m.start && k<m.start) return false;
  if(m.days && k>addDays(m.start||k,Number(m.days)-1)) return false;
  return true;
}
function dosesFor(k){
  const out=[];
  S.meds.forEach(m=>{ if(m.prn||!medActiveOn(m,k))return;
    (m.times||[]).forEach(t=>out.push({key:k+"|"+m.id+"|"+t,med:m,time:t,min:toMin(t),status:S.log[k+"|"+m.id+"|"+t]||null}));
  });
  return out.sort((a,b)=>a.min-b.min);
}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;}
const DUE_WINDOW=60; // minutes a dose stays "due" before it counts as missed
function stateOf(d){
  if(d.status==="taken")return"taken"; if(d.status==="skipped")return"skipped";
  const n=nowMin(); if(n<d.min)return"upcoming"; if(n<d.min+DUE_WINDOW)return"due"; return"missed";
}
function nextDose(){
  const n=nowMin(); const k=today();
  const t=dosesFor(k).find(d=>!d.status && d.min+DUE_WINDOW>n);
  if(t) return {...t,day:k};
  for(let i=1;i<8;i++){const k2=addDays(k,i);const f=dosesFor(k2)[0];if(f)return{...f,day:k2,offset:i};}
  return null;
}

function audioReady(){return AC && AC.state==="running";}
function unlockAudio(){

/* ---------- speech (Arabic text-to-speech) ---------- */
const HAS_TTS="speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let VOICES=[], speechPrimed=false;
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices()||[]; }catch(e){ VOICES=[]; } }
if(HAS_TTS){ loadVoices(); try{ speechSynthesis.addEventListener("voiceschanged",()=>{loadVoices(); const vi=document.getElementById("voiceInfo"); if(vi){const t=voiceInfo(); if(vi.textContent!==t) vi.textContent=t;}
      const sel=document.getElementById("voice"); const ar=arVoices(); if(sel&&sel.options.length!==ar.length+1){ sel.innerHTML=voiceOptions(); } }); }catch(e){} }
// Browsers don't report a voice's gender, so female voices are recognised by name.
const FEMALE=/salma|laila|layla|leila|hoda|huda|zeina|zeinab|zainab|mariam|maryam|amira|amna|fatima|hala|rana|dalia|nour|noura|sara|yasmin|samira|farah|reem|rasha|mona|female|woman|سلمى|ليلى|هدى|زينة|مريم/i;
const MALE=/maged|majed|shakir|hamed|tarek|naayf|naif|omar|ahmed|(^|[^e])male/i;
const arVoices=()=>{ if(!VOICES.length) loadVoices(); return VOICES.filter(v=>new RegExp("^"+LANG+"([-_]|$)","i").test(v.lang)); };
const isFemale=v=>FEMALE.test(v.name);
const isMale=v=>MALE.test(v.name)&&!FEMALE.test(v.name);
const wantMale=()=>S.settings.gender==="male";
function arabicVoice(){
  const ar=arVoices(); if(!ar.length) return null;
  if(S.settings.voiceURI){ const p=ar.find(v=>v.voiceURI===S.settings.voiceURI); if(p) return p; }
  return wantMale()
    ? (ar.find(isMale) || ar.find(v=>!isFemale(v)) || ar[0])
    : (ar.find(isFemale) || ar.find(v=>!isMale(v)) || ar[0]);
}
// Pitch nudges the voice toward the chosen gender when the phone has no voice of that gender.
function voicePitch(v){
  if(!v) return wantMale()?0.8:1.25;
  if(wantMale()) return isMale(v)?1:(isFemale(v)?0.7:0.85);
  return isFemale(v)?1:(isMale(v)?1.45:1.25);
}
function voiceOptions(){
  return `<option value="">${T("تلقائي حسب النوع")}</option>`+arVoices().map(v=>`<option value="${esc(v.voiceURI)}" ${S.settings.voiceURI===v.voiceURI?"selected":""}>${esc(v.name)}${isFemale(v)?" — "+T("نسائي")+"":isMale(v)?" — "+T("رجالي")+"":""}</option>`).join("");
}
// What the alarm says (Modern Standard Arabic).
// Fallback text for the phone voice, used only if a recording is missing. The medicine name is shown, not spoken.
function alarmSpeech(m){
  const food=FOOD[m.food||""];
  return `${T("حان موعد الدواء. يُرجى تناوُل الجرعة")} ${food||""+T("الآن")+""}. ${T("مع تمنياتنا بالصحة والعافية")}.`;
}

/* ---------- recorded voice messages (bundled mp3, work offline) ---------- */
const CLIPS={}; let currentClip=null;
const clipKey=m=>["before","after","with","empty","sleep"].includes(m.food)?m.food:"none";
async function loadClip(name){
  if(name in CLIPS) return CLIPS[name];
  CLIPS[name]=(async()=>{ try{ const r=await fetch("voice/"+name+".mp3"); if(!r.ok) return null; const buf=await r.arrayBuffer();
      return await new Promise((res,rej)=>AC.decodeAudioData(buf,res,rej)); }catch(e){ return null; } })();
  return CLIPS[name];
}
function preloadClips(){ if(!AC) return; const g=(LANG==="en"?"en-":"")+(wantMale()?"m":"f"); ["none","before","after","with","empty","sleep"].forEach(k=>loadClip(g+"-"+k)); }
async function playReminder(m,done){
  let finished=false; const end=()=>{ if(finished)return; finished=true; currentClip=null; done&&done(); };
  if(!S.settings.speech){ setTimeout(end,1200); return; }
  if(!AC) unlockAudio();
  const k=clipKey(m), pre=LANG==="en"?"en-":"", g=pre+(wantMale()?"m":"f"), other=pre+(wantMale()?"f":"m");
  let buf=null; if(AC){ buf=await loadClip(g+"-"+k) || await loadClip(other+"-"+k); }
  if(buf){
    try{ const src=AC.createBufferSource(), gain=AC.createGain(); gain.gain.value=Math.min(1.5,S.settings.volume*1.6);
      src.buffer=buf; src.connect(gain).connect(AC.destination); src.onended=end; src.start(); currentClip=src;
      setTimeout(end,(buf.duration+1.5)*1000); return; }catch(e){}
  }
  speak(alarmSpeech(m),end);
}
// Phones (iPhone especially) only allow speech after it was first started by a tap.
function primeSpeech(){
  if(!HAS_TTS||speechPrimed) return; speechPrimed=true;
  try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; u.lang="ar"; speechSynthesis.speak(u); }catch(e){}
}
function speak(text,done){
  let finished=false; const end=()=>{ if(finished)return; finished=true; done&&done(); };
  if(!S.settings.speech||!HAS_TTS){ setTimeout(end,1200); return; }
  try{
    const u=new SpeechSynthesisUtterance(text); const v=arabicVoice();
    if(v){u.voice=v;u.lang=v.lang;} else u.lang=LANG==="en"?"en-US":"ar-SA";
    // No known female voice on the phone: raise the pitch a little for a softer voice.
    u.pitch = voicePitch(v);
    u.rate=.92; u.volume=1; u.onend=end; u.onerror=end;
    const go=()=>{ try{ speechSynthesis.resume(); speechSynthesis.speak(u); }catch(e){ end(); } };
    // Chrome on Android drops a speak() issued right after cancel(); give it a moment.
    if(speechSynthesis.speaking||speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(go,250); } else go();
    setTimeout(end,Math.max(6000,text.length*160));
  }catch(e){ end(); }
}
/* ---------- alarm tones (synthesised, no sound files needed) ---------- */
function note(f,dt,dur,type,amp,f2){
  const t=AC.currentTime+dt, o=AC.createOscillator(), g=AC.createGain(); const v=Math.max(.001,S.settings.volume*amp);
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.linearRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.05);
}
const TONES={
  chime:{name:""+T("رنين هادئ")+"",play(){[[880,0],[1175,.18],[1568,.36],[1175,.9],[1568,1.08],[2093,1.26]].forEach(([f,d])=>note(f,d,.5,"sine",.6));}},
  bell:{name:""+T("جرس")+"",play(){[0,.8].forEach(d=>{note(660,d,1.6,"sine",.5);note(1320,d,1.1,"sine",.22);note(1980,d,.7,"sine",.12);note(2640,d,.4,"sine",.06);});}},
  classic:{name:""+T("منبّه كلاسيكي")+"",play(){for(let i=0;i<4;i++){note(1046,i*.32,.12,"square",.22);note(1046,i*.32+.15,.12,"square",.22);}}},
  marimba:{name:""+T("ماريمبا")+"",play(){[[523,0],[659,.15],[784,.3],[1046,.45],[784,.75],[1046,.9],[1318,1.05]].forEach(([f,d])=>{note(f,d,.35,"triangle",.7);note(f*4,d,.08,"sine",.1);});}},
  soft:{name:""+T("نبضات ناعمة")+"",play(){[0,.55,1.1].forEach(d=>note(440,d,.45,"sine",.55,520));}},
  birds:{name:""+T("عصافير")+"",play(){[0,.22,.5,.72,1.1,1.3].forEach((d,i)=>note(2400+(i%3)*300,d,.14,"sine",.3,3400+(i%2)*400));}},
  urgent:{name:""+T("تنبيه عاجل")+"",play(){[0,.45,.9].forEach(d=>note(700,d,.4,"sawtooth",.18,1300));}},
};
function chime(){ if(!AC) return; try{ (TONES[S.settings.tone]||TONES.chime).play(); }catch(e){} }
// Ring cycle: tone + vibrate, then the recorded voice message, then repeat until a button is pressed.
let ringing=false;
function startRinging(m){
  stopRinging(); ringing=true; let n=0;
  const cycle=()=>{ if(!ringing)return;
    chime(); if(navigator.vibrate) try{navigator.vibrate([400,200,400,200,800]);}catch(e){}
    const say = S.settings.speech && n<8; n++;
    if(say) ringTimer=setTimeout(()=>{ if(!ringing)return; playReminder(m,()=>{ if(ringing) ringTimer=setTimeout(cycle,900); }); },1700);
    else ringTimer=setTimeout(cycle,3200);
  };
  cycle();
}
function stopRinging(){ ringing=false; if(ringTimer){clearTimeout(ringTimer);ringTimer=null;}
  try{ currentClip&&currentClip.stop(); }catch(e){} currentClip=null;
  try{ if(HAS_TTS) speechSynthesis.cancel();}catch(e){} if(navigator.vibrate) try{navigator.vibrate(0);}catch(e){} }

let SWREG=null;
if(!NATIVE && "serviceWorker" in navigator && location.protocol.startsWith("http")){

  let reloaded=false; const hadController=!!navigator.serviceWorker.controller;

  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{SWREG=r; r.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); });
  }).catch(()=>{});
}
function notifySupported(){return "Notification" in window;}
async function systemNotify(title,body,tag){
  if(!notifySupported()||Notification.permission!=="granted") return;
  const opts={body,tag,icon:"icon.svg",badge:"icon.svg",requireInteraction:true,renotify:true,vibrate:[400,200,400],dir:"rtl",lang:"ar"};
  try{ if(SWREG) await SWREG.showNotification(title,opts); else new Notification(title,opts);}catch(e){}
}

let alarmQueue=[], alarmOpen=null; const snoozed={}; const fired={};
function checkDue(){
  const k=today(), n=nowMin(), now=Date.now();
  dosesFor(k).forEach(d=>{
    if(d.status) return;
    const due = n>=d.min && n<d.min+DUE_WINDOW;
    if(!due) return;
    if(snoozed[d.key] && now<snoozed[d.key]) return;
    if(fired[d.key] && !snoozed[d.key]) return;
    if(alarmOpen && alarmOpen.key===d.key) return;
    if(alarmQueue.some(q=>q.key===d.key)) return;
    fired[d.key]=true; delete snoozed[d.key];
    alarmQueue.push(d);
  });
  if(!alarmOpen && alarmQueue.length) showAlarm(alarmQueue.shift());
}
function showAlarm(d){
  alarmOpen=d; const m=d.med; const r=rxOf(m.rxId); const dr=r&&doctor(r.doctorId);
  const food=FOOD[m.food||""];
  const L=document.createElement("div"); L.className="alarm"; L.setAttribute("role","alertdialog"); L.setAttribute("aria-label",""+T("موعد الدواء")+"");
  L.innerHTML=`<div class="box">
    <div class="ring">${pill(64,"#ffffff")}</div>
    <div class="label" style="color:inherit;opacity:.85">${T("حان موعد الدواء")} · ${fmtTime(d.time)}</div>
    <h2>${esc(m.name)}</h2>
    ${m.dose?`<div class="dosebig">${esc(m.dose)}</div>`:""}
    ${diseaseOf(m)?`<div class="alarm-dz">${T("لعلاج")} ${esc(diseaseOf(m))}</div>`:""}
    <div class="meta">${[food,dr?(""+T("د")+". "+esc(dr.name)):"",m.notes?esc(m.notes):""].filter(Boolean).join(" · ")}</div>
    ${alarmQueue.length?`<div class="more">${T("و")}${alarmQueue.length} ${alarmQueue.length>1?""+T("أدوية أخرى")+"":""+T("دواء آخر")+""} ${T("في نفس الوقت")}</div>`:""}
    <div class="btns">
      <button class="btn take" data-a="taken">${I.check} ${T("أخذت الدواء")}</button>
      <button class="btn alt" data-a="snooze">${T("ذكّرني بعد")} ${S.settings.snooze} ${T("دقائق")}</button>
      <button class="btn alt" data-a="skipped">${T("تخطّي هذه الجرعة")}</button>
    </div></div>`;
  document.body.appendChild(L);
  L.querySelector("[data-a=taken]").focus();
  L.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;
    const a=b.dataset.a; stopRinging(); L.remove(); alarmOpen=null;
    if(a==="snooze"){ snoozed[d.key]=Date.now()+S.settings.snooze*60000; toast(""+T("سيتم التذكير بعد")+" "+S.settings.snooze+" "+T("دقائق")+""); }
    else { if(!d.key.startsWith("test|")){S.log[d.key]=a; save();} toast(a==="taken"?""+T("تم تسجيل الجرعة")+" ✓":""+T("تم تخطي الجرعة")+""); }
    render(); setTimeout(checkDue,300);
  });
  startRinging(m);
  systemNotify("💊 "+T("حان موعد")+" "+m.name,(m.dose||"")+(food?" · "+food:""),d.key);
}

  } else {
    h+=`<div class="empty"><b>${T("لا توجد جرعات مجدولة اليوم")}</b>${T("سجّل وصفة من طبيبك، أو أضف دواءً بدون وصفة مثل فيتامين أو مسكّن")}.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-go="${S.doctors.length?"rx":"doctors"}">${I.plus} ${S.doctors.length?""+T("إضافة وصفة")+"":""+T("إضافة طبيب")+""}</button><button class="btn ghost" data-go="otc">${I.plus} ${T("دواء بدون وصفة")}</button></div></div>`;
  }
  // as-needed medicines (no fixed schedule)
  const prn=S.meds.filter(m=>m.prn&&!m.paused);

    h+=`<div class="sec-head" style="margin-top:6px"><h2>${T("عند اللزوم")}</h2><span class="label">${T("سجّل الجرعة عندما تأخذها")}</span></div>`;
    h+=prn.map(m=>{const s=prnStatus(m);
      const last=s.last?`${T("آخر جرعة")} ${fmtClock(s.last)}${s.lastDay!==today()?" ("+new Date(s.last).toLocaleDateString(LOC,{weekday:"long"})+")":""}`:""+T("لم تُؤخذ بعد")+"";
      const warn=s.maxed?`<span class="chip bad">${T("وصلت للحد اليومي")}</span>`:s.waitMin>0?`<span class="chip amb">${T("الجرعة التالية بعد")} ${fmtDur(s.waitMin)}</span>`:"";
      return `<div class="dose ${s.maxed||s.waitMin>0?"due":"upcoming"}"><div class="time">${s.count}<small>${T("اليوم")}${m.maxDay?" "+T("من")+" "+m.maxDay:""}</small></div>
        <div class="info"><b>${esc(m.name)}${dz(m)}</b><span>${esc(m.dose||"")}${FOOD[m.food||""]?" · "+FOOD[m.food||""]:""}</span><span>${last} ${warn}</span></div>
        <div class="acts" style="flex-direction:column">${s.last&&Date.now()-s.last<6*3600000?`<button class="btn sm ghost" data-prnundo="${s.last}" aria-label="${T("حذف آخر جرعة مسجلة")}">${T("تراجع")}</button>`:""}<button class="btn sm ok" data-prn="${m.id}">${I.check} ${T("أخذت")}</button></div></div>`;}).join("");
    h+=`<div id="prnConfirm"></div>`;
  }
  // last 7 days adherence
  if(S.meds.length){
    let w=`<div class="card" style="display:grid;gap:10px"><div class="label">${T("الالتزام خلال آخر 7 أيام")}</div><div class="week">`;
    for(let i=6;i>=0;i--){const kk=addDays(k,-i);const ds=dosesFor(kk);const t=ds.filter(x=>S.log[x.key]==="taken").length;
      const dt=new Date(Date.now()-i*864e5); let cls=""; if(ds.length&&i>0){cls=t===ds.length?"full":t?"part":"none";} else if(ds.length&&i===0&&t===ds.length)cls="full";
      w+=`<div><i class="${cls}">${dt.getDate()}</i>${i===0?""+T("اليوم")+"":(LANG==="en"?dayName(dt).slice(0,3):dayName(dt).replace("ال","").slice(0,5))}</div>`;}
    h+=w+`</div></div>`;
  }
  h+=GIFT;
  $("#view").innerHTML=h;
  const ae=$("#askExact"); if(ae) ae.onclick=askExact;
  const ha=$("#hideApk"); if(ha) ha.onclick=()=>{S.settings.hideApk=true;save();render();};
}

/* ---------- as-needed (PRN) helpers ---------- */
const fmtClock=ts=>{const d=new Date(ts);return fmtTime(pad(d.getHours())+":"+pad(d.getMinutes()));};
const fmtDur=min=>{min=Math.ceil(min);return min<60?min+" "+T("دقيقة")+"":Math.floor(min/60)+" "+T("س")+""+(min%60?" "+T("و")+""+(min%60)+" "+T("د")+"":"");};
function prnStatus(m){
  const mine=S.prn.filter(x=>x.medId===m.id).sort((a,b)=>b.ts-a.ts);
  const k=today(); const count=mine.filter(x=>dkey(new Date(x.ts))===k).length;
  const last=mine[0]?mine[0].ts:null;
  const waitMin=last&&m.gapH?Math.max(0,(last+Number(m.gapH)*3600000-Date.now())/60000):0;
  return {count,last,lastDay:last?dkey(new Date(last)):null,waitMin,maxed:!!(m.maxDay&&count>=Number(m.maxDay))};
}
function logPrn(id,force){
  const m=S.meds.find(x=>x.id===id); if(!m)return; const s=prnStatus(m);
  if(!force&&(s.maxed||s.waitMin>0)){
    const box=$("#prnConfirm"); if(!box)return;
    box.innerHTML=`<div class="card" style="display:grid;gap:8px;border-color:var(--amber)"><b>${T("تنبيه")}: ${esc(m.name)}</b><span class="hint">${s.maxed?""+T("أخذت الحد الأقصى المسموح اليوم")+" ("+m.maxDay+" "+T("جرعات)")+".":""+T("لم تمر المدة المحددة بين الجرعات. الجرعة التالية بعد")+" "+fmtDur(s.waitMin)+"."} ${T("راجع الطبيب أو الصيدلي قبل زيادة الجرعة")}.</span>
      <div class="row"><button class="btn ghost sm" data-prnforce="${m.id}">${T("تسجيل الجرعة على أي حال")}</button><button class="btn line sm" data-prncancel>${T("إلغاء")}</button></div></div>`;
    box.scrollIntoView({behavior:"smooth",block:"center"}); return;
  }
  const ts=Date.now(); S.prn.push({medId:id,ts}); save(); render();
  toast(""+T("تم تسجيل")+" "+m.name+" "+T("الساعة")+" "+fmtClock(ts));
}

// The illness a medicine treats: its own field, or the diagnosis written on its prescription.
function diseaseOf(m){ if(m.disease) return m.disease; const r=m.rxId&&rxOf(m.rxId); return r&&r.title?r.title:""; }
const dz=m=>{const t=diseaseOf(m); return t?` <small class="dz">${esc(t)}</small>`:"";};
function medRow(m){const food=FOOD[m.food||""]; const end=m.days?addDays(m.start,Number(m.days)-1):null; const ended=end&&end<today();
  const when=m.prn?`${T("عند اللزوم")}${m.gapH?" · "+T("كل")+" "+m.gapH+" "+T("ساعات على الأقل")+"":""}${m.maxDay?" · "+T("حد أقصى")+" "+m.maxDay+" "+T("في اليوم")+"":""}`:(m.days?""+T("لمدة")+" "+m.days+" "+T("يوم")+"":""+T("مستمر")+"");
  return `<div class="med">${pill(26,m.prn?"var(--amber)":"var(--teal)")}<div><b>${esc(m.name)}</b>${dz(m)} ${m.paused?'<span class="chip mut">'+T("متوقف")+'</span>':ended?'<span class="chip mut">'+T("انتهى")+'</span>':""}
  <div class="sub">${esc(m.dose||"")}${food?" · "+food:""} · ${when}</div>
  ${m.prn?"":`<div class="times">${(m.times||[]).map(t=>`<span class="chip teal">${fmtTime(t)}</span>`).join("")}</div>`}</div>
  <button class="icon-btn" data-editmed="${m.id}" aria-label="${T("تعديل")} ${esc(m.name)}">${I.edit}</button></div>`;}
function vRx(){
  const otc=S.meds.filter(m=>!m.rxId||!rxOf(m.rxId));
  let h=`<div class="sec-head"><h2>${T("أدوية بدون وصفة")}</h2><button class="btn sm ghost" id="addOtc">${I.plus} ${T("إضافة")}</button></div>`;

    :`<div class="empty"><b>${T("لا توجد أدوية بدون وصفة")}</b>${T("أضف فيتاميناً يومياً بمواعيد ثابتة، أو مسكّناً تأخذه عند اللزوم فقط")}.</div>`;
  h+=`<div class="sec-head" style="margin-top:8px"><h2>${T("الوصفات الطبية")}</h2><button class="btn sm" id="addRx">${I.plus} ${T("وصفة جديدة")}</button></div>`;
  if(!S.rx.length) h+=`<div class="empty"><b>${T("لا توجد وصفات")}</b>${T("سجّل كل وصفة باسم الطبيب الذي كتبها، ثم أضف إليها الأدوية ومواعيدها")}.</div>`;
  S.rx.map((r,i)=>({r,i})).sort((a,b)=>(b.r.date||"").localeCompare(a.r.date||"")||b.i-a.i).map(x=>x.r).forEach(r=>{
    const dr=doctor(r.doctorId); const meds=S.meds.filter(m=>m.rxId===r.id);

      <button class="icon-btn" data-editrx="${r.id}" aria-label="${T("تعديل الوصفة")}">${I.edit}</button></div>`;
    h+=[...meds].reverse().map(medRow).join("");
    h+=`<button class="btn line sm" data-addmed="${r.id}">${I.plus} ${T("إضافة دواء لهذه الوصفة")}</button></div>`;

  $("#view").innerHTML=h;
  $("#addRx").onclick=()=>rxSheet();

/* ---------- view: monthly reports (newest month first) ---------- */
const monthKey=k=>k.slice(0,7);
const monthName=mk=>{const[y,m]=mk.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(LOC,{month:"long",year:"numeric"});};
function monthsWithData(){
  const set=new Set([monthKey(today())]);
  S.rx.forEach(r=>r.date&&set.add(monthKey(r.date)));
  Object.keys(S.log).forEach(k=>/^\d{4}-\d{2}/.test(k)&&set.add(k.slice(0,7)));
  S.prn.forEach(p=>set.add(monthKey(dkey(new Date(p.ts)))));
  S.meds.forEach(m=>m.start&&!m.prn&&set.add(monthKey(m.start)));
  return [...set].filter(mk=>mk<=monthKey(today())).sort().reverse();
}
function monthStats(mk){
  const [y,m]=mk.split("-").map(Number); const last=new Date(y,m,0).getDate(); const tk=today();
  let planned=0,taken=0,skipped=0;
  for(let d=1;d<=last;d++){ const k=mk+"-"+pad(d); if(k>tk) break;
    dosesFor(k).forEach(x=>{ if(k===tk && x.min>nowMin()) return; planned++; const st=S.log[x.key]; if(st==="taken")taken++; else if(st==="skipped")skipped++; }); }
  const rx=S.rx.map((r,i)=>({r,i})).filter(x=>x.r.date&&monthKey(x.r.date)===mk).sort((a,b)=>b.r.date.localeCompare(a.r.date)||b.i-a.i).map(x=>x.r);
  const docIds=[...new Set(rx.map(r=>r.doctorId).filter(Boolean))];
  const prn=S.prn.filter(p=>monthKey(dkey(new Date(p.ts)))===mk);
  const prnBy={}; prn.forEach(p=>{prnBy[p.medId]=(prnBy[p.medId]||0)+1;});
  return {planned,taken,skipped,missed:planned-taken-skipped,pct:planned?Math.round(taken/planned*100):null,rx,docIds,prnBy,prnCount:prn.length};
}
let openMonth=null;
function vReports(){
  const months=monthsWithData(); if(openMonth===null||(openMonth&&!months.includes(openMonth))) openMonth=months[0];
  let h=`<div class="sec-head"><h2>${T("التقارير الشهرية")}</h2><span class="label">${T("الأحدث أولاً")}</span></div>`;
  if(!S.doctors.length&&!S.meds.length){ $("#view").innerHTML=h+`<div class="empty"><b>${T("لا توجد بيانات بعد")}</b>${T("عندما تضيف أطباءك ووصفاتهم وتسجّل جرعاتك، يظهر هنا ملخص لكل شهر")}.</div>`; return; }
  months.forEach(mk=>{
    const s=monthStats(mk); const open=mk===openMonth; const cur=mk===monthKey(today());
    const pctCls=s.pct===null?"mut":s.pct>=90?"ok":s.pct>=60?"amb":"bad";
    h+=`<div class="card rep ${open?"open":""}">
      <button class="rep-head" data-month="${mk}" aria-expanded="${open}">
        <div><h3>${monthName(mk)}</h3><span class="sub">${s.rx.length} ${s.rx.length===1?""+T("وصفة")+"":""+T("وصفات")+""} · ${s.docIds.length} ${s.docIds.length===1?""+T("طبيب")+"":""+T("أطباء")+""}${cur?" · "+T("الشهر الحالي")+"":""}</span></div>
        <span class="chip ${pctCls}">${s.pct===null?""+T("لا جرعات")+"":""+T("التزام")+" "+s.pct+"%"}</span></button>`;
    if(open){
      h+=`<div class="rep-stats">
        <div><b>${s.taken}</b><span>${T("جرعة أُخذت")}</span></div>
        <div><b>${s.missed}</b><span>${T("فاتت")}</span></div>
        <div><b>${s.skipped}</b><span>${T("تخطّي")}</span></div>
        <div><b>${s.prnCount}</b><span>${T("عند اللزوم")}</span></div></div>`;
      if(s.planned) h+=`<div class="progress" aria-label="${T("نسبة الالتزام")} ${s.pct}%"><i style="width:${s.pct}%"></i></div>`;
      h+=`<div class="rep-sec"><div class="label">${T("الوصفات خلال الشهر")}</div>`;
      h+= s.rx.length ? s.rx.map(r=>{const dr=doctor(r.doctorId); const meds=S.meds.filter(m=>m.rxId===r.id);
          return `<div class="rep-row"><div class="rep-date">${new Date(r.date).toLocaleDateString(LOC,{day:"numeric",month:"short"})}</div>
            <div class="rep-body"><b>${dr?""+T("د")+". "+esc(dr.name):""+T("طبيب غير محدد")+""}</b><span class="sub">${dr&&dr.specialty?esc(dr.specialty):""}${r.title?(dr&&dr.specialty?" · ":"")+esc(r.title):""}</span>
            ${meds.length?`<div class="times">${meds.map(m=>`<span class="chip teal">${esc(m.name)}</span>`).join("")}</div>`:""}</div></div>`;}).join("")
        : `<p class="hint">${T("لا توجد وصفات جديدة في هذا الشهر")}.</p>`;
      h+=`</div>`;
      if(s.docIds.length){
        h+=`<div class="rep-sec"><div class="label">${T("الأطباء الذين زرتهم")}</div>`+s.docIds.map(id=>{const d=doctor(id); const n=s.rx.filter(r=>r.doctorId===id).length;
          return d?`<div class="rep-doc"><div class="avatar">${esc(d.name.trim().charAt(0))}</div><div><b>${T("د")}. ${esc(d.name)}</b><span class="sub">${esc(d.specialty||"")}</span></div><span class="chip mut">${n} ${n===1?""+T("وصفة")+"":""+T("وصفات")+""}</span></div>`:"";}).join("")+`</div>`;
      }
      const prnIds=Object.keys(s.prnBy);
      if(prnIds.length){
        h+=`<div class="rep-sec"><div class="label">${T("أدوية عند اللزوم")}</div>`+prnIds.sort((a,b)=>s.prnBy[b]-s.prnBy[a]).map(id=>{const m=S.meds.find(x=>x.id===id);
          return `<div class="rep-doc"><div>${pill(26,"var(--amber)")}</div><div><b>${m?esc(m.name):""+T("دواء محذوف")+""}</b><span class="sub">${m?esc(m.dose||""):""}</span></div><span class="chip amb">${s.prnBy[id]} ${T("مرة")}</span></div>`;}).join("")+`</div>`;
      }
    }
    h+=`</div>`;
  });
  $("#view").innerHTML=h;
  $("#view").querySelectorAll("[data-month]").forEach(b=>b.onclick=()=>{ openMonth = openMonth===b.dataset.month? "" : b.dataset.month; vReports(); });
}

// Fetch the newest app files now. Only cached app files are removed; the user's data is untouched.
async function forceUpdate(){
  if(!navigator.onLine){ toast(""+T("اتصل بالإنترنت أولاً ثم اضغط تحديث")+""); return; }
  toast(""+T("جاري التحديث")+"…");
  try{ const regs=await navigator.serviceWorker?.getRegistrations?.()||[]; await Promise.all(regs.map(r=>r.unregister())); }catch(e){}
  try{ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }catch(e){}
  setTimeout(()=>location.reload(),400);
}

function download(name,text,type){
  try{const b=new Blob([text],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); toast(""+T("تم تجهيز الملف")+": "+name);}
  catch(e){toast(""+T("لم يسمح المتصفح بحفظ الملف")+"");}
}
function exportICS(){
  const active=S.meds.filter(m=>!m.paused && !(m.days && addDays(m.start,Number(m.days)-1)<today()));
  if(!active.length){toast(""+T("لا توجد أدوية نشطة لإضافتها")+"");return;}
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MedReminder//AR","CALSCALE:GREGORIAN","X-WR-CALNAME:"+T("أدويتي")+""];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const icsEsc=s=>String(s||"").replace(/[\\,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  active.forEach(m=>(m.times||[]).forEach(t=>{
    const start=(m.start&&m.start>today()?m.start:today()).replace(/-/g,"");
    let rr="RRULE:FREQ=DAILY"; if(m.days){const end=addDays(m.start,Number(m.days)-1).replace(/-/g,"");rr+=";UNTIL="+end+"T235959";}
    const food=FOOD[m.food||""];
    L.push("BEGIN:VEVENT","UID:"+m.id+"-"+t.replace(":","")+"@med.local","DTSTAMP:"+stamp,"DTSTART:"+start+"T"+t.replace(":","")+"00","DURATION:PT10M",rr,
      "SUMMARY:"+icsEsc("💊 "+m.name+" — "+(m.dose||"")),"DESCRIPTION:"+icsEsc([m.dose,food,m.notes].filter(Boolean).join(" · ")),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(""+T("حان موعد")+" "+m.name+" — "+(m.dose||"")),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
  }));
  L.push("END:VCALENDAR");
  download("medicine-schedule.ics",L.join("\r\n"),"text/calendar");
}

/* ---------- sheets (forms) ---------- */
function sheet(html,onMount){
  const L=$("#layer"); L.innerHTML=`<div class="scrim"><form class="sheet" novalidate>${html}</form></div>`;
  const sc=L.firstChild, f=sc.querySelector("form");
  const close=()=>{L.innerHTML="";};
  sc.addEventListener("click",e=>{if(e.target===sc)close();});
  f.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
  f.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  onMount(f,close); const first=f.querySelector("input,select"); if(first) setTimeout(()=>first.focus(),60);
}

    <div class="field"><label for="mn">${T("اسم الدواء")}</label><input id="mn" list="${otc?"otcnames":""}" value="${esc(m.name)}" placeholder="${otc?""+T("مثال: فيتامين د 1000 وحدة")+"":""+T("مثال: كونكور 5 مجم")+""}">${otc?`<datalist id="otcnames">${[""+T("فيتامين د")+"",""+T("فيتامين سي")+"",""+T("فيتامين ب")+"12",""+T("أوميجا")+" 3",""+T("حديد")+"",""+T("كالسيوم")+"",""+T("ماغنسيوم")+"",""+T("زنك")+"",""+T("مالتي فيتامين")+"",""+T("باراسيتامول")+"",""+T("إيبوبروفين")+"",""+T("مضاد حموضة")+"",""+T("دواء برد")+""].map(s=>`<option value="${s}">`).join("")}</datalist>`:""}</div>
    <div class="field"><label for="md">${T("الجرعة")}</label><input id="md" list="doses" value="${esc(m.dose)}" placeholder="${T("مثال: قرص واحد")}"><datalist id="doses">${[""+T("قرص واحد")+"",""+T("نصف قرص")+"",""+T("قرصان")+"",""+T("كبسولة واحدة")+"",""+T("ملعقة صغيرة 5 مل")+"",""+T("ملعقة كبيرة 15 مل")+"",""+T("نقطتان")+"",""+T("حقنة واحدة")+"",""+T("بخة واحدة")+"",""+T("وحدات أنسولين")+"",""+T("فوار واحد")+""].map(s=>`<option value="${s}">`).join("")}</datalist></div>
    <div class="field"><label>${T("طريقة الأخذ")}</label><div class="presets seg" id="kind"><button type="button" data-k="0">${T("مواعيد ثابتة يومياً")}</button><button type="button" data-k="1">${T("عند اللزوم فقط")}</button></div></div>
    <div id="prnBox" style="display:grid;gap:8px"><p class="hint">${T("مثل المسكّنات: لا يرن له منبّه، وتسجّل الجرعة من شاشة «اليوم» عندما تأخذها. التطبيق ينبّهك إذا أخذتها قبل المدة المحددة أو تجاوزت الحد اليومي")}.</p>
      <div class="two"><div class="field"><label for="mg">${T("أقل مدة بين الجرعتين (ساعات)")}</label><input id="mg" type="number" min="1" max="48" inputmode="numeric" value="${esc(m.gapH)}" placeholder="${T("مثال")}: 6"></div>
      <div class="field"><label for="mx">${T("أقصى عدد جرعات في اليوم")}</label><input id="mx" type="number" min="1" max="24" inputmode="numeric" value="${esc(m.maxDay)}" placeholder="${T("مثال")}: 4"></div></div></div>
    <div class="field" id="schedBox"><label>${T("مواعيد الجرعات خلال اليوم")}</label>
      <div class="presets" id="pre"><button type="button" data-p="09:00">${T("مرة")}</button><button type="button" data-p="09:00,21:00">${T("مرتين")}</button><button type="button" data-p="08:00,14:00,20:00">3 ${T("مرات")}</button><button type="button" data-p="06:00,14:00,22:00">${T("كل 8 ساعات")}</button><button type="button" data-p="08:00,12:00,16:00,20:00">4 ${T("مرات")}</button></div>
      <div class="times-edit" id="tl"></div>
      <button type="button" class="btn line sm" id="addT" style="justify-self:start">${I.plus} ${T("إضافة موعد")}</button></div>
    <div class="field"><label for="mf">${T("التعليمات")}</label><select id="mf">${Object.entries(FOOD).map(([k,v])=>`<option value="${k}" ${k===(m.food||"")?"selected":""}>${v||""+T("بدون تعليمات")+""}</option>`).join("")}</select></div>
    <div class="two" id="durBox"><div class="field"><label for="ms">${T("يبدأ من")}</label><input id="ms" type="date" value="${esc(m.start)}"></div>
    <div class="field"><label for="mdays">${T("المدة بالأيام")}</label><input id="mdays" type="number" min="1" inputmode="numeric" value="${esc(m.days)}" placeholder="${T("فارغ")} = ${T("مستمر")}"></div></div>
    <div class="field"><label for="mdz">${T("لعلاج (اسم المرض)")}</label><input id="mdz" list="dzlist" value="${esc(m.disease||"")}" placeholder="${T("مثال: ضغط الدم")}"><datalist id="dzlist">${[""+T("ضغط الدم")+"",""+T("السكر")+"",""+T("الكوليسترول")+"",""+T("القلب")+"",""+T("الغدة الدرقية")+"",""+T("المعدة")+"",""+T("القولون")+"",""+T("المفاصل")+"",""+T("الصداع")+"",""+T("الحساسية")+"",""+T("الربو")+"",""+T("الأعصاب")+"",""+T("البرد والإنفلونزا")+"",""+T("فيتامينات ومكملات")+"",""+T("سيولة الدم")+"",""+T("البروستاتا")+"",""+T("هشاشة العظام")+""].map(x=>`<option value="${x}">`).join("")}</datalist></div>
    <div class="field"><label for="mno">${T("ملاحظات")}</label><input id="mno" value="${esc(m.notes)}" placeholder="${T("اختياري")}"></div>
    ${!isNew?`<div class="set-item"><div><b>${T("إيقاف مؤقت للدواء")}</b><small>${T("لن تظهر جرعاته ولن يرن له منبّه")}</small></div><input type="checkbox" class="switch" id="mp" ${m.paused?"checked":""} aria-label="${T("إيقاف مؤقت")}"></div>`:""}
    <p class="err" id="er" hidden></p>
    <button class="btn block" type="submit">${T("حفظ الدواء")}</button>${del?del.html:""}`,
  (f,close)=>{ if(del)del.bind(f,close);
    // Hour, minute and AM/PM as three large lists: easier than the phone's clock picker and allows any minute.
    const drawT=()=>{ $("#tl").innerHTML=times.map((t,i)=>{ let [h,mi]=t.split(":").map(Number); const pm=h>=12; const h12=h%12||12;
        return `<div class="t" data-i="${i}"><span class="tn">${i+1}</span>
        <select data-p="h" aria-label="${T("الساعة للموعد")} ${i+1}">${Array.from({length:12},(_,k)=>k+1).map(x=>`<option value="${x}" ${x===h12?"selected":""}>${x}</option>`).join("")}</select>
        <b>:</b>
        <select data-p="m" aria-label="${T("الدقيقة للموعد")} ${i+1}">${Array.from({length:60},(_,k)=>k).map(x=>`<option value="${x}" ${x===mi?"selected":""}>${pad(x)}</option>`).join("")}</select>
        <select data-p="ap" aria-label="${T("صباحاً أو مساءً للموعد")} ${i+1}"><option value="am" ${!pm?"selected":""}>${T("صباحاً")}</option><option value="pm" ${pm?"selected":""}>${T("مساءً")}</option></select>
        ${times.length>1?`<button type="button" class="icon-btn" data-rm="${i}" aria-label="${T("حذف الموعد")}">${I.x}</button>`:""}</div>`;}).join("");
      $("#tl").querySelectorAll(".t").forEach(row=>row.onchange=()=>{ const g=p=>row.querySelector(`[data-p="${p}"]`).value;
        let h=Number(g("h"))%12; if(g("ap")==="pm") h+=12; times[row.dataset.i]=pad(h)+":"+pad(Number(g("m"))); });
      $("#tl").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{times.splice(b.dataset.rm,1);drawT();}); };
    drawT();
    const drawK=()=>{ $("#kind").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String((b.dataset.k==="1")===prn)));
      $("#prnBox").hidden=!prn; $("#schedBox").hidden=prn; $("#durBox").hidden=prn; };
    drawK(); $("#kind").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;prn=b.dataset.k==="1";drawK();};
    $("#addT").onclick=()=>{const last=times[times.length-1]||"08:00";const n=(toMin(last)+240)%1440;times.push(pad(Math.floor(n/60))+":"+pad(n%60));drawT();};
    $("#pre").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;times=b.dataset.p.split(",");drawT();};
    f.onsubmit=e=>{e.preventDefault(); const er=$("#er");
      const name=$("#mn").value.trim(); const clean=[...new Set(times.filter(Boolean))].sort();
      if(!name){er.textContent=""+T("اكتب اسم الدواء")+"";er.hidden=false;return;}
      if(!prn&&!clean.length){er.textContent=""+T("أضف موعداً واحداً على الأقل")+"";er.hidden=false;return;}
      const num=v=>v?String(Math.max(1,parseInt(v)||1)):"";
      Object.assign(m,{prn,gapH:prn?num($("#mg").value):"",maxDay:prn?num($("#mx").value):""});
      Object.assign(m,{name,dose:$("#md").value.trim(),times:prn?[]:clean,food:$("#mf").value,start:$("#ms").value||today(),days:$("#mdays").value?String(Math.max(1,parseInt($("#mdays").value))):"",disease:$("#mdz").value.trim(),notes:$("#mno").value.trim()});
      const mp=$("#mp"); if(mp) m.paused=mp.checked;
      if(isNew){m.id=uid();S.meds.push(m);} save(); close(); render(); toast(isNew?""+T("تمت إضافة الدواء ومواعيده")+"":""+T("تم الحفظ")+""); unlockAudio();};
  });
}

function welcome(){
  sheet(`<div style="display:flex;justify-content:center">${langSwitch()}</div><div style="display:grid;gap:6px;justify-items:center;text-align:center;padding-top:6px">${pill(56,"var(--teal)")}<h2>${T("أهلاً بك في أدويتي")}</h2><p class="hint">${T("سجّل أطباءك ووصفاتهم وأدويتك، وسينبّهك التطبيق بصوت عند كل جرعة. كل البيانات تبقى على هاتفك فقط")}.</p></div>
    <div class="field"><label for="wn">${T("اسمك")}</label><input id="wn" placeholder="${T("اكتب اسمك")}" autocomplete="name"></div>
    <label class="set-item" style="cursor:pointer"><div><b>${T("أضف بيانات تجريبية")}</b><small>${T("طبيب ووصفة ودواءان للتجربة، يمكنك حذفها لاحقاً")}</small></div><input type="checkbox" class="switch" id="wdemo"></label>
    <button class="btn block" type="submit">${T("ابدأ")}</button>
    ${GIFT}`,
  (f,close)=>{f.onsubmit=e=>{e.preventDefault(); S.profile.name=$("#wn").value.trim();
    if($("#wdemo").checked) seedDemo(); save(); close(); unlockAudio(); render();
    if(notifySupported()&&Notification.permission==="default") try{Notification.requestPermission();}catch(_){} };});
}
function seedDemo(){
  const d1={id:uid(),name:""+T("منى عبد الرحمن")+"",specialty:""+T("قلب وأوعية دموية")+"",phone:"0223456789",clinic:""+T("عيادة المعادي")+"",demo:1};
  const d2={id:uid(),name:""+T("كريم فوزي")+"",specialty:""+T("سكر وغدد صماء")+"",phone:"",clinic:"",demo:1};
  const r1={id:uid(),doctorId:d1.id,date:addDays(today(),-10),title:""+T("متابعة ضغط")+""};
  const r2={id:uid(),doctorId:d2.id,date:addDays(today(),-3),title:""};
  S.doctors.push(d1,d2); S.rx.push(r1,r2);
  S.meds.push({id:uid(),rxId:r1.id,name:""+T("دواء الضغط (مثال)")+"",disease:""+T("ضغط الدم")+"",dose:""+T("قرص واحد")+"",times:["09:00"],food:"after",start:addDays(today(),-10),days:"",notes:""},
    {id:uid(),rxId:r1.id,name:""+T("أسبرين 81 (مثال)")+"",disease:""+T("سيولة الدم")+"",dose:""+T("قرص واحد")+"",times:["14:00"],food:"after",start:addDays(today(),-10),days:"",notes:""},
    {id:uid(),rxId:r2.id,name:""+T("ميتفورمين 500 (مثال)")+"",disease:""+T("السكر")+"",dose:""+T("قرص واحد")+"",times:["08:00","20:00"],food:"with",start:addDays(today(),-3),days:"30",notes:""},
    {id:uid(),rxId:"",name:""+T("فيتامين د (مثال)")+"",disease:""+T("فيتامينات ومكملات")+"",dose:""+T("كبسولة واحدة")+"",times:["10:00"],food:"with",start:today(),days:"",notes:""},
    {id:uid(),rxId:"",name:""+T("باراسيتامول 500 (مثال)")+"",dose:""+T("قرص واحد")+"",times:[],prn:true,gapH:"6",maxDay:"4",food:"after",start:today(),days:"",disease:""+T("الصداع")+"",notes:""});
}

/* ---------- toast ---------- */
let tT=null;
function toast(msg){ let t=$("#toast"); if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.innerHTML=`<span>${esc(msg)}</span>`; t.hidden=false; clearTimeout(tT); tT=setTimeout(()=>{t.hidden=true;},2400); }

/* ---------- boot ---------- */
nativeSetup();
document.addEventListener("visibilitychange",async()=>{ if(document.visibilityState==="visible"){ const was=exactOK; await checkExact(); if(was!==exactOK) render(); scheduleNativeSoon(); } });
render();
if(!S.profile.name && !S.meds.length) welcome();
if(S.settings.wake) setWake(true);
setInterval(()=>{checkDue();},10000);
setInterval(()=>{ if(!document.querySelector(".scrim") && tab!=="more") render(); else renderTop(); },60000);
setTimeout(checkDue,1500);
try{ if("speechSynthesis" in window) speechSynthesis.getVoices(); }catch(e){}
})();
</script>

</body>
</html>
