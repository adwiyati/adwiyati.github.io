<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>أدويتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14504f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — sticky header with the next dose, scrolling list, fixed bottom tab bar. Pharmacy-label feel. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#e8eeea; --ink:#16231f; --muted:#5d6d67; --line:#d5ddd8;
  --teal:#14504f; --teal-ink:#ffffff; --teal-soft:#d9ebe7;
  --amber:#c46a12; --amber-soft:#fbe9d4; --ok:#2f7d4a; --ok-soft:#dcefe2; --bad:#b23a3a; --bad-soft:#f6dddd;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17221f; --surface-2:#1f2d29; --ink:#e6eeea; --muted:#9aaba5; --line:#2b3a36;
  --teal:#5fb3a8; --teal-ink:#0b1513; --teal-soft:#1c3531; --amber:#f0a14d; --amber-soft:#3a2a17;
  --ok:#6cc58a; --ok-soft:#183223; --bad:#ef7d7d; --bad-soft:#3a1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17221f; --surface-2:#1f2d29; --ink:#e6eeea; --muted:#9aaba5; --line:#2b3a36;
  --teal:#5fb3a8; --teal-ink:#0b1513; --teal-soft:#1c3531; --amber:#f0a14d; --amber-soft:#3a2a17;
  --ok:#6cc58a; --ok-soft:#183223; --bad:#ef7d7d; --bad-soft:#3a1d1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--teal)}
#app{min-height:100vh;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--teal);color:var(--teal-ink)}
.top .wrap{padding-block:14px 16px;display:grid;gap:10px}
.hello{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hello h1{font-size:1.25rem}
.hello small{opacity:.85;font-size:.85rem}
.next{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border-radius:var(--r);padding:10px 12px}
:root[data-theme="dark"] .next{background:rgba(0,0,0,.15)}
.next .pill{flex:none}
.next b{font-family:var(--f-display);font-weight:600;display:block}
.next span{font-size:.85rem;opacity:.9}
.next .cd{margin-inline-start:auto;font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.sound-warn{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--amber);color:#fff;border-radius:10px;padding:8px 12px;font-size:.9rem}
.sound-warn button{background:#fff;color:var(--amber);border:0;border-radius:8px;padding:6px 12px;font-weight:600}

/* sections */
main .wrap{padding-block:18px;display:grid;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-head h2{font-size:1.15rem}
.label{font-size:.78rem;letter-spacing:.02em;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.empty{text-align:center;color:var(--muted);padding:28px 14px;border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);margin-bottom:4px}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--teal);color:var(--teal-ink);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:8px}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* dose timeline */
.dose{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-inline-start:5px solid var(--line)}
.dose .time{font-family:var(--f-display);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums;min-width:4.6em;text-align:center;line-height:1.2}
.dose .time small{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.dose .info{min-width:0}
.dose .info b{font-family:var(--f-display);font-weight:600;display:block;overflow-wrap:anywhere}
.dose .info span{color:var(--muted);font-size:.88rem;display:block}
.dose .acts{display:flex;gap:6px}
.dose.taken{border-inline-start-color:var(--ok);opacity:.75}
.dose.skipped{border-inline-start-color:var(--muted);opacity:.6}
.dose.missed{border-inline-start-color:var(--bad)}
.dose.due{border-inline-start-color:var(--amber);background:var(--amber-soft)}
.dose.upcoming{border-inline-start-color:var(--teal)}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.amb{background:var(--amber-soft);color:var(--amber)}
.chip.mut{background:var(--surface-2);color:var(--muted)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}

/* prescriptions & doctors */
.rx{display:grid;gap:10px}
.rx-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rx-head h3{font-size:1.02rem}
.rx-head p{margin:0;color:var(--muted);font-size:.88rem}
.med{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--surface-2)}
.med b{font-family:var(--f-display);font-weight:600;overflow-wrap:anywhere}
.med .sub{font-size:.85rem;color:var(--muted)}
.med .times{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.doc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.doc b{font-family:var(--f-display);font-weight:600}
.doc .sub{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.icon-btn{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:8px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* tab bar */
.tabs{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabs button{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;align-content:center;gap:2px;font-size:.78rem;font-weight:500}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--teal);font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:1.2rem}
.field{display:grid;gap:4px}
.field label{font-size:.88rem;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:46px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.times-edit{display:flex;flex-wrap:wrap;gap:8px}
.times-edit{flex-direction:column;align-items:stretch}
.times-edit .t{display:flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:6px 8px;direction:ltr;justify-content:flex-end}
.times-edit .t .tn{margin-inline-end:auto;color:var(--muted);font-size:.85rem;direction:rtl}
.times-edit .t select{font-family:var(--f-display);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums;min-height:48px;padding:4px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.times-edit .t select[data-p="ap"]{font-size:1rem;direction:rtl}
.times-edit .t b{font-size:1.3rem}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:4px 12px;font-size:.85rem}
.presets.seg button{padding:8px 14px;font-weight:500}
.presets button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.err{color:var(--bad);font-size:.88rem;margin:0}
.hint{color:var(--muted);font-size:.85rem;margin:0}

/* alarm */
.alarm{position:fixed;inset:0;z-index:60;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));text-align:center}
.alarm .box{display:grid;gap:14px;justify-items:center;max-width:420px;width:100%}
.ring{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 18px rgba(255,255,255,.08)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
.alarm h2{font-size:clamp(2.4rem,11vw,3.4rem);line-height:1.15;overflow-wrap:anywhere}
.alarm .dosebig{font-size:clamp(1.5rem,7vw,2rem);font-weight:700;background:rgba(255,255,255,.18);padding:8px 22px;border-radius:99px}
.alarm .meta{opacity:.9;font-size:1.2rem}
.alarm .label{font-size:1.1rem!important}
.alarm .btns{display:grid;gap:10px;width:100%;margin-top:8px}
.alarm .btn{padding:14px;font-size:1.05rem}
.alarm .btn.take{background:#fff;color:var(--teal)}
:root[data-theme="dark"] .alarm .btn.take{background:var(--teal-ink);color:var(--teal)}
.alarm .btn.alt{background:rgba(255,255,255,.16);color:inherit}
.alarm .more{font-size:.9rem;opacity:.85}

.toast{position:fixed;inset-inline:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);z-index:50;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.set-list{display:grid;gap:0}
.set-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-item:last-child{border-bottom:0}
.set-item div{min-width:0}
.set-item b{display:block;font-weight:600}
.set-item small{color:var(--muted);display:block;line-height:1.4}
.switch{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;cursor:pointer;border:0}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.switch:checked{background:var(--teal)}
.switch:checked::after{inset-inline-start:23px}
textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;direction:ltr;text-align:left;min-height:120px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:grid;gap:4px;justify-items:center;font-size:.72rem;color:var(--muted)}
.week i{width:100%;max-width:34px;aspect-ratio:1;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-size:.75rem;font-weight:600;color:var(--ink)}
.week i.full{background:var(--ok);color:#fff}
.week i.part{background:var(--amber-soft);color:var(--amber)}
.week i.none{background:var(--bad-soft);color:var(--bad)}
</style>

</head><body>
<div id="app" dir="rtl" lang="ar">
  <header class="top"><div class="wrap" id="top"></div></header>
  <main><div class="wrap" id="view"></div></main>
  <nav class="tabs" aria-label="التنقل"><div class="in" id="tabs"></div></nav>
</div>
<div id="layer"></div>

<script>
(function(){
"use strict";
document.documentElement.lang="ar"; document.documentElement.dir="rtl";

/* ---------- storage ---------- */
const KEY="dawa.v1";
const APP_VERSION="1.7";
const blank=()=>({profile:{name:""},doctors:[],rx:[],meds:[],log:{},prn:[],settings:{speech:true,volume:0.8,snooze:10,wake:false,tone:"chime",voiceURI:"",gender:"female"}});
let S=blank();
function load(){try{const t=localStorage.getItem(KEY);if(t){S=Object.assign(blank(),JSON.parse(t));S.settings=Object.assign(blank().settings,S.settings||{});}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("تعذّر الحفظ على هذا الجهاز");}}
load();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dkey(new Date());
const toMin=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
function fmtTime(t){let[h,m]=t.split(":").map(Number);const ap=h<12?"ص":"م";h=h%12||12;return h+":"+pad(m)+" "+ap;}
const dayName=d=>d.toLocaleDateString("ar-EG",{weekday:"long"});
const fmtDate=d=>d.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"});
function addDays(k,n){const[y,m,d]=k.split("-").map(Number);const x=new Date(y,m-1,d+n);return dkey(x);}
const doctor=id=>S.doctors.find(d=>d.id===id);
const rxOf=id=>S.rx.find(r=>r.id===id);
const FOOD={"":"","before":"قبل الأكل","after":"بعد الأكل","with":"مع الأكل","empty":"على معدة فارغة","sleep":"قبل النوم"};
const SPECS=["باطنة","قلب وأوعية دموية","سكر وغدد صماء","عظام","أنف وأذن وحنجرة","عيون","جلدية","أطفال","نساء وتوليد","مخ وأعصاب","نفسية","صدر","كلى","مسالك بولية","جهاز هضمي وكبد","أسنان","روماتيزم","أورام","طب أسرة"];

function medActiveOn(m,k){
  if(m.paused) return false;
  if(m.start && k<m.start) return false;
  if(m.days && k>addDays(m.start||k,Number(m.days)-1)) return false;
  return true;
}
function dosesFor(k){
  const out=[];
  S.meds.forEach(m=>{ if(m.prn||!medActiveOn(m,k))return;
    (m.times||[]).forEach(t=>out.push({key:k+"|"+m.id+"|"+t,med:m,time:t,min:toMin(t),status:S.log[k+"|"+m.id+"|"+t]||null}));
  });
  return out.sort((a,b)=>a.min-b.min);
}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;}
const DUE_WINDOW=60; // minutes a dose stays "due" before it counts as missed
function stateOf(d){
  if(d.status==="taken")return"taken"; if(d.status==="skipped")return"skipped";
  const n=nowMin(); if(n<d.min)return"upcoming"; if(n<d.min+DUE_WINDOW)return"due"; return"missed";
}
function nextDose(){
  const n=nowMin(); const k=today();
  const t=dosesFor(k).find(d=>!d.status && d.min+DUE_WINDOW>n);
  if(t) return {...t,day:k};
  for(let i=1;i<8;i++){const k2=addDays(k,i);const f=dosesFor(k2)[0];if(f)return{...f,day:k2,offset:i};}
  return null;
}

/* ---------- icons ---------- */
const I={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  rx:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h3a2 2 0 0 1 0 4H9V7m3 5 4 5m0-4-4 4"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3v5a4 4 0 0 0 8 0V3"/><path d="M10 12v3a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2"/></svg>',
  set:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
};
const pill=(size=34,c1="currentColor")=>`<svg class="pill" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><g transform="rotate(-40 24 24)"><rect x="6" y="15" width="36" height="18" rx="9" fill="none" stroke="${c1}" stroke-width="3"/><path d="M24 15h9a9 9 0 0 1 0 18h-9z" fill="${c1}"/></g></svg>`;

/* ---------- audio / alarm engine ---------- */
let AC=null, ringTimer=null, wakeLock=null;
function audioReady(){return AC && AC.state==="running";}
function unlockAudio(){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state!=="running") AC.resume().then(renderTop); preloadClips(); }catch(e){}
  renderTop();
}
document.addEventListener("pointerdown",()=>{ if(!audioReady()) unlockAudio(); primeSpeech(); },{capture:true});
document.addEventListener("touchend",primeSpeech,{capture:true});

/* ---------- speech (Arabic text-to-speech) ---------- */
const HAS_TTS="speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let VOICES=[], speechPrimed=false;
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices()||[]; }catch(e){ VOICES=[]; } }
if(HAS_TTS){ loadVoices(); try{ speechSynthesis.addEventListener("voiceschanged",()=>{loadVoices(); const vi=document.getElementById("voiceInfo"); if(vi){const t=voiceInfo(); if(vi.textContent!==t) vi.textContent=t;}
      const sel=document.getElementById("voice"); const ar=arVoices(); if(sel&&sel.options.length!==ar.length+1){ sel.innerHTML=voiceOptions(); } }); }catch(e){} }
// Browsers don't report a voice's gender, so female voices are recognised by name.
const FEMALE=/salma|laila|layla|leila|hoda|huda|zeina|zeinab|zainab|mariam|maryam|amira|amna|fatima|hala|rana|dalia|nour|noura|sara|yasmin|samira|farah|reem|rasha|mona|female|woman|سلمى|ليلى|هدى|زينة|مريم/i;
const MALE=/maged|majed|shakir|hamed|tarek|naayf|naif|omar|ahmed|(^|[^e])male/i;
const arVoices=()=>{ if(!VOICES.length) loadVoices(); return VOICES.filter(v=>/^ar([-_]|$)/i.test(v.lang)); };
const isFemale=v=>FEMALE.test(v.name);
const isMale=v=>MALE.test(v.name)&&!FEMALE.test(v.name);
const wantMale=()=>S.settings.gender==="male";
function arabicVoice(){
  const ar=arVoices(); if(!ar.length) return null;
  if(S.settings.voiceURI){ const p=ar.find(v=>v.voiceURI===S.settings.voiceURI); if(p) return p; }
  return wantMale()
    ? (ar.find(isMale) || ar.find(v=>!isFemale(v)) || ar[0])
    : (ar.find(isFemale) || ar.find(v=>!isMale(v)) || ar[0]);
}
// Pitch nudges the voice toward the chosen gender when the phone has no voice of that gender.
function voicePitch(v){
  if(!v) return wantMale()?0.8:1.25;
  if(wantMale()) return isMale(v)?1:(isFemale(v)?0.7:0.85);
  return isFemale(v)?1:(isMale(v)?1.45:1.25);
}
function voiceOptions(){
  return `<option value="">تلقائي حسب النوع</option>`+arVoices().map(v=>`<option value="${esc(v.voiceURI)}" ${S.settings.voiceURI===v.voiceURI?"selected":""}>${esc(v.name)}${isFemale(v)?" — نسائي":isMale(v)?" — رجالي":""}</option>`).join("");
}
// What the alarm says (Modern Standard Arabic).
// Fallback text for the phone voice, used only if a recording is missing. The medicine name is shown, not spoken.
function alarmSpeech(m){
  const food=FOOD[m.food||""];
  return `حان موعد الدواء. يُرجى تناوُل الجرعة ${food||"الآن"}. مع تمنياتنا بالصحة والعافية.`;
}

/* ---------- recorded voice messages (bundled mp3, work offline) ---------- */
const CLIPS={}; let currentClip=null;
const clipKey=m=>["before","after","with","empty","sleep"].includes(m.food)?m.food:"none";
async function loadClip(name){
  if(name in CLIPS) return CLIPS[name];
  CLIPS[name]=(async()=>{ try{ const r=await fetch("voice/"+name+".mp3"); if(!r.ok) return null; const buf=await r.arrayBuffer();
      return await new Promise((res,rej)=>AC.decodeAudioData(buf,res,rej)); }catch(e){ return null; } })();
  return CLIPS[name];
}
function preloadClips(){ if(!AC) return; const g=wantMale()?"m":"f"; ["none","before","after","with","empty","sleep"].forEach(k=>loadClip(g+"-"+k)); }
async function playReminder(m,done){
  let finished=false; const end=()=>{ if(finished)return; finished=true; currentClip=null; done&&done(); };
  if(!S.settings.speech){ setTimeout(end,1200); return; }
  if(!AC) unlockAudio();
  const k=clipKey(m), g=wantMale()?"m":"f", other=g==="m"?"f":"m";
  let buf=null; if(AC){ buf=await loadClip(g+"-"+k) || await loadClip(other+"-"+k); }
  if(buf){
    try{ const src=AC.createBufferSource(), gain=AC.createGain(); gain.gain.value=Math.min(1.5,S.settings.volume*1.6);
      src.buffer=buf; src.connect(gain).connect(AC.destination); src.onended=end; src.start(); currentClip=src;
      setTimeout(end,(buf.duration+1.5)*1000); return; }catch(e){}
  }
  speak(alarmSpeech(m),end);
}
// Phones (iPhone especially) only allow speech after it was first started by a tap.
function primeSpeech(){
  if(!HAS_TTS||speechPrimed) return; speechPrimed=true;
  try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; u.lang="ar"; speechSynthesis.speak(u); }catch(e){}
}
function speak(text,done){
  let finished=false; const end=()=>{ if(finished)return; finished=true; done&&done(); };
  if(!S.settings.speech||!HAS_TTS){ setTimeout(end,1200); return; }
  try{
    const u=new SpeechSynthesisUtterance(text); const v=arabicVoice();
    if(v){u.voice=v;u.lang=v.lang;} else u.lang="ar-SA";
    // No known female voice on the phone: raise the pitch a little for a softer voice.
    u.pitch = voicePitch(v);
    u.rate=.92; u.volume=1; u.onend=end; u.onerror=end;
    const go=()=>{ try{ speechSynthesis.resume(); speechSynthesis.speak(u); }catch(e){ end(); } };
    // Chrome on Android drops a speak() issued right after cancel(); give it a moment.
    if(speechSynthesis.speaking||speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(go,250); } else go();
    setTimeout(end,Math.max(6000,text.length*160));
  }catch(e){ end(); }
}
/* ---------- alarm tones (synthesised, no sound files needed) ---------- */
function note(f,dt,dur,type,amp,f2){
  const t=AC.currentTime+dt, o=AC.createOscillator(), g=AC.createGain(); const v=Math.max(.001,S.settings.volume*amp);
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.linearRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.05);
}
const TONES={
  chime:{name:"رنين هادئ",play(){[[880,0],[1175,.18],[1568,.36],[1175,.9],[1568,1.08],[2093,1.26]].forEach(([f,d])=>note(f,d,.5,"sine",.6));}},
  bell:{name:"جرس",play(){[0,.8].forEach(d=>{note(660,d,1.6,"sine",.5);note(1320,d,1.1,"sine",.22);note(1980,d,.7,"sine",.12);note(2640,d,.4,"sine",.06);});}},
  classic:{name:"منبّه كلاسيكي",play(){for(let i=0;i<4;i++){note(1046,i*.32,.12,"square",.22);note(1046,i*.32+.15,.12,"square",.22);}}},
  marimba:{name:"ماريمبا",play(){[[523,0],[659,.15],[784,.3],[1046,.45],[784,.75],[1046,.9],[1318,1.05]].forEach(([f,d])=>{note(f,d,.35,"triangle",.7);note(f*4,d,.08,"sine",.1);});}},
  soft:{name:"نبضات ناعمة",play(){[0,.55,1.1].forEach(d=>note(440,d,.45,"sine",.55,520));}},
  birds:{name:"عصافير",play(){[0,.22,.5,.72,1.1,1.3].forEach((d,i)=>note(2400+(i%3)*300,d,.14,"sine",.3,3400+(i%2)*400));}},
  urgent:{name:"تنبيه عاجل",play(){[0,.45,.9].forEach(d=>note(700,d,.4,"sawtooth",.18,1300));}},
};
function chime(){ if(!AC) return; try{ (TONES[S.settings.tone]||TONES.chime).play(); }catch(e){} }
// Ring cycle: tone + vibrate, then the recorded voice message, then repeat until a button is pressed.
let ringing=false;
function startRinging(m){
  stopRinging(); ringing=true; let n=0;
  const cycle=()=>{ if(!ringing)return;
    chime(); if(navigator.vibrate) try{navigator.vibrate([400,200,400,200,800]);}catch(e){}
    const say = S.settings.speech && n<8; n++;
    if(say) ringTimer=setTimeout(()=>{ if(!ringing)return; playReminder(m,()=>{ if(ringing) ringTimer=setTimeout(cycle,900); }); },1700);
    else ringTimer=setTimeout(cycle,3200);
  };
  cycle();
}
function stopRinging(){ ringing=false; if(ringTimer){clearTimeout(ringTimer);ringTimer=null;}
  try{ currentClip&&currentClip.stop(); }catch(e){} currentClip=null;
  try{ if(HAS_TTS) speechSynthesis.cancel();}catch(e){} if(navigator.vibrate) try{navigator.vibrate(0);}catch(e){} }

let SWREG=null;
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  // Check for a new version every time the app opens; when it arrives, reload once so it shows straight away.
  let reloaded=false; const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded||!hadController||document.querySelector(".scrim"))return; reloaded=true; location.reload(); });
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{SWREG=r; r.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); });
  }).catch(()=>{});
}
function notifySupported(){return "Notification" in window;}
async function systemNotify(title,body,tag){
  if(!notifySupported()||Notification.permission!=="granted") return;
  const opts={body,tag,icon:"icon.svg",badge:"icon.svg",requireInteraction:true,renotify:true,vibrate:[400,200,400],dir:"rtl",lang:"ar"};
  try{ if(SWREG) await SWREG.showNotification(title,opts); else new Notification(title,opts);}catch(e){}
}

let alarmQueue=[], alarmOpen=null; const snoozed={}; const fired={};
function checkDue(){
  const k=today(), n=nowMin(), now=Date.now();
  dosesFor(k).forEach(d=>{
    if(d.status) return;
    const due = n>=d.min && n<d.min+DUE_WINDOW;
    if(!due) return;
    if(snoozed[d.key] && now<snoozed[d.key]) return;
    if(fired[d.key] && !snoozed[d.key]) return;
    if(alarmOpen && alarmOpen.key===d.key) return;
    if(alarmQueue.some(q=>q.key===d.key)) return;
    fired[d.key]=true; delete snoozed[d.key];
    alarmQueue.push(d);
  });
  if(!alarmOpen && alarmQueue.length) showAlarm(alarmQueue.shift());
}
function showAlarm(d){
  alarmOpen=d; const m=d.med; const r=rxOf(m.rxId); const dr=r&&doctor(r.doctorId);
  const food=FOOD[m.food||""];
  const L=document.createElement("div"); L.className="alarm"; L.setAttribute("role","alertdialog"); L.setAttribute("aria-label","موعد الدواء");
  L.innerHTML=`<div class="box">
    <div class="ring">${pill(64,"#ffffff")}</div>
    <div class="label" style="color:inherit;opacity:.85">حان موعد الدواء · ${fmtTime(d.time)}</div>
    <h2>${esc(m.name)}</h2>
    <div class="dosebig">${esc(m.dose||"")}</div>
    <div class="meta">${[food,dr?("د. "+esc(dr.name)):"",m.notes?esc(m.notes):""].filter(Boolean).join(" · ")}</div>
    ${alarmQueue.length?`<div class="more">و${alarmQueue.length} ${alarmQueue.length>1?"أدوية أخرى":"دواء آخر"} في نفس الوقت</div>`:""}
    <div class="btns">
      <button class="btn take" data-a="taken">${I.check} أخذت الدواء</button>
      <button class="btn alt" data-a="snooze">ذكّرني بعد ${S.settings.snooze} دقائق</button>
      <button class="btn alt" data-a="skipped">تخطّي هذه الجرعة</button>
    </div></div>`;
  document.body.appendChild(L);
  L.querySelector("[data-a=taken]").focus();
  L.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;
    const a=b.dataset.a; stopRinging(); L.remove(); alarmOpen=null;
    if(a==="snooze"){ snoozed[d.key]=Date.now()+S.settings.snooze*60000; toast("سيتم التذكير بعد "+S.settings.snooze+" دقائق"); }
    else { if(!d.key.startsWith("test|")){S.log[d.key]=a; save();} toast(a==="taken"?"تم تسجيل الجرعة ✓":"تم تخطي الجرعة"); }
    render(); setTimeout(checkDue,300);
  });
  startRinging(m);
  systemNotify("💊 حان موعد "+m.name,(m.dose||"")+(food?" · "+food:""),d.key);
}

/* ---------- as-needed (PRN) helpers ---------- */
const fmtClock=ts=>{const d=new Date(ts);return fmtTime(pad(d.getHours())+":"+pad(d.getMinutes()));};
const fmtDur=min=>{min=Math.ceil(min);return min<60?min+" دقيقة":Math.floor(min/60)+" س"+(min%60?" و"+(min%60)+" د":"");};
function prnStatus(m){
  const mine=S.prn.filter(x=>x.medId===m.id).sort((a,b)=>b.ts-a.ts);
  const k=today(); const count=mine.filter(x=>dkey(new Date(x.ts))===k).length;
  const last=mine[0]?mine[0].ts:null;
  const waitMin=last&&m.gapH?Math.max(0,(last+Number(m.gapH)*3600000-Date.now())/60000):0;
  return {count,last,lastDay:last?dkey(new Date(last)):null,waitMin,maxed:!!(m.maxDay&&count>=Number(m.maxDay))};
}
function logPrn(id,force){
  const m=S.meds.find(x=>x.id===id); if(!m)return; const s=prnStatus(m);
  if(!force&&(s.maxed||s.waitMin>0)){
    const box=$("#prnConfirm"); if(!box)return;
    box.innerHTML=`<div class="card" style="display:grid;gap:8px;border-color:var(--amber)"><b>تنبيه: ${esc(m.name)}</b><span class="hint">${s.maxed?"أخذت الحد الأقصى المسموح اليوم ("+m.maxDay+" جرعات).":"لم تمر المدة المحددة بين الجرعات. الجرعة التالية بعد "+fmtDur(s.waitMin)+"."} راجع الطبيب أو الصيدلي قبل زيادة الجرعة.</span>
      <div class="row"><button class="btn ghost sm" data-prnforce="${m.id}">تسجيل الجرعة على أي حال</button><button class="btn line sm" data-prncancel>إلغاء</button></div></div>`;
    box.scrollIntoView({behavior:"smooth",block:"center"}); return;
  }
  const ts=Date.now(); S.prn.push({medId:id,ts}); save(); render();
  toast("تم تسجيل "+m.name+" الساعة "+fmtClock(ts));
}

// Fetch the newest app files now. Only cached app files are removed; the user's data is untouched.
async function forceUpdate(){
  if(!navigator.onLine){ toast("اتصل بالإنترنت أولاً ثم اضغط تحديث"); return; }
  toast("جاري التحديث…");
  try{ const regs=await navigator.serviceWorker?.getRegistrations?.()||[]; await Promise.all(regs.map(r=>r.unregister())); }catch(e){}
  try{ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }catch(e){}
  setTimeout(()=>location.reload(),400);
}

  const v=arabicVoice();
  if(v) return "الصوت المستخدم: "+v.name+(isFemale(v)?" (نسائي)":isMale(v)?" (رجالي)":"");

    : "لم يُعثر على صوت عربي. من إعدادات الهاتف ← اللغة والإدخال ← تحويل النص إلى كلام ← محرك Google ← تثبيت بيانات الصوت ← العربية.";
}
function restore(txt){
  try{const d=JSON.parse(txt); if(!d||!Array.isArray(d.meds)||!Array.isArray(d.doctors)) throw 0;
    S=Object.assign(blank(),d); S.settings=Object.assign(blank().settings,d.settings||{}); save(); toast("تمت الاستعادة"); render();}
  catch(e){toast("الملف أو النص غير صالح كنسخة احتياطية");}
}
function download(name,text,type){
  try{const b=new Blob([text],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); toast("تم تجهيز الملف: "+name);}
  catch(e){toast("لم يسمح المتصفح بحفظ الملف");}
}
function exportICS(){
  const active=S.meds.filter(m=>!m.paused && !(m.days && addDays(m.start,Number(m.days)-1)<today()));
  if(!active.length){toast("لا توجد أدوية نشطة لإضافتها");return;}
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MedReminder//AR","CALSCALE:GREGORIAN","X-WR-CALNAME:أدويتي"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const icsEsc=s=>String(s||"").replace(/[\\,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  active.forEach(m=>(m.times||[]).forEach(t=>{
    const start=(m.start&&m.start>today()?m.start:today()).replace(/-/g,"");
    let rr="RRULE:FREQ=DAILY"; if(m.days){const end=addDays(m.start,Number(m.days)-1).replace(/-/g,"");rr+=";UNTIL="+end+"T235959";}
    const food=FOOD[m.food||""];
    L.push("BEGIN:VEVENT","UID:"+m.id+"-"+t.replace(":","")+"@med.local","DTSTAMP:"+stamp,"DTSTART:"+start+"T"+t.replace(":","")+"00","DURATION:PT10M",rr,
      "SUMMARY:"+icsEsc("💊 "+m.name+" — "+(m.dose||"")),"DESCRIPTION:"+icsEsc([m.dose,food,m.notes].filter(Boolean).join(" · ")),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc("حان موعد "+m.name+" — "+(m.dose||"")),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
  }));
  L.push("END:VCALENDAR");
  download("medicine-schedule.ics",L.join("\r\n"),"text/calendar");
}

/* ---------- sheets (forms) ---------- */
function sheet(html,onMount){
  const L=$("#layer"); L.innerHTML=`<div class="scrim"><form class="sheet" novalidate>${html}</form></div>`;
  const sc=L.firstChild, f=sc.querySelector("form");
  const close=()=>{L.innerHTML="";};
  sc.addEventListener("click",e=>{if(e.target===sc)close();});
  f.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
  f.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  onMount(f,close); const first=f.querySelector("input,select"); if(first) setTimeout(()=>first.focus(),60);
}

function delRow(label,onYes){ // two-step delete inside the sheet

    bind(f,close){const r=f.querySelector("[data-delrow]"); if(!r)return; r.querySelector("[data-del]").onclick=()=>{
      r.innerHTML=`<span class="hint">تأكيد الحذف؟</span><button type="button" class="btn danger sm" data-yes>نعم، احذف</button><button type="button" class="btn ghost sm" data-no>إلغاء</button>`;
      r.querySelector("[data-yes]").onclick=()=>{onYes();save();close();render();toast("تم الحذف");};
      r.querySelector("[data-no]").onclick=()=>{r.innerHTML=`<button type="button" class="btn danger sm" data-del>${label}</button>`;delRow(label,onYes).bind(f,close);};}}};
}

function medSheet(m,rxId){
  const isNew=!m; m=m||{rxId,name:"",dose:"",times:["09:00"],food:"after",start:today(),days:"",notes:"",paused:false,prn:false,gapH:"",maxDay:""};
  let times=m.times&&m.times.length?[...m.times]:["09:00"]; let prn=!!m.prn;
  const otc=!m.rxId;
  const del=!isNew&&delRow("حذف الدواء",()=>{S.meds=S.meds.filter(x=>x.id!==m.id);S.prn=S.prn.filter(x=>x.medId!==m.id);});
  sheet(`${head(isNew?(otc?"دواء بدون وصفة":"إضافة دواء"):"تعديل الدواء")}
    ${otc?`<p class="hint">للفيتامينات والمكملات والمسكّنات التي تأخذها بدون وصفة طبيب.</p>`:""}
    <div class="field"><label for="mn">اسم الدواء</label><input id="mn" list="${otc?"otcnames":""}" value="${esc(m.name)}" placeholder="${otc?"مثال: فيتامين د 1000 وحدة":"مثال: كونكور 5 مجم"}">${otc?`<datalist id="otcnames">${["فيتامين د","فيتامين سي","فيتامين ب12","أوميجا 3","حديد","كالسيوم","ماغنسيوم","زنك","مالتي فيتامين","باراسيتامول","إيبوبروفين","مضاد حموضة","دواء برد"].map(s=>`<option value="${s}">`).join("")}</datalist>`:""}</div>
    <div class="field"><label for="md">الجرعة</label><input id="md" list="doses" value="${esc(m.dose)}" placeholder="مثال: قرص واحد"><datalist id="doses">${["قرص واحد","نصف قرص","قرصان","كبسولة واحدة","ملعقة صغيرة 5 مل","ملعقة كبيرة 15 مل","نقطتان","حقنة واحدة","بخة واحدة","وحدات أنسولين","فوار واحد"].map(s=>`<option value="${s}">`).join("")}</datalist></div>
    <div class="field"><label>طريقة الأخذ</label><div class="presets seg" id="kind"><button type="button" data-k="0">مواعيد ثابتة يومياً</button><button type="button" data-k="1">عند اللزوم فقط</button></div></div>
    <div id="prnBox" style="display:grid;gap:8px"><p class="hint">مثل المسكّنات: لا يرن له منبّه، وتسجّل الجرعة من شاشة «اليوم» عندما تأخذها. التطبيق ينبّهك إذا أخذتها قبل المدة المحددة أو تجاوزت الحد اليومي.</p>
      <div class="two"><div class="field"><label for="mg">أقل مدة بين الجرعتين (ساعات)</label><input id="mg" type="number" min="1" max="48" inputmode="numeric" value="${esc(m.gapH)}" placeholder="مثال: 6"></div>
      <div class="field"><label for="mx">أقصى عدد جرعات في اليوم</label><input id="mx" type="number" min="1" max="24" inputmode="numeric" value="${esc(m.maxDay)}" placeholder="مثال: 4"></div></div></div>
    <div class="field" id="schedBox"><label>مواعيد الجرعات خلال اليوم</label>
      <div class="presets" id="pre"><button type="button" data-p="09:00">مرة</button><button type="button" data-p="09:00,21:00">مرتين</button><button type="button" data-p="08:00,14:00,20:00">3 مرات</button><button type="button" data-p="06:00,14:00,22:00">كل 8 ساعات</button><button type="button" data-p="08:00,12:00,16:00,20:00">4 مرات</button></div>
      <div class="times-edit" id="tl"></div>
      <button type="button" class="btn line sm" id="addT" style="justify-self:start">${I.plus} إضافة موعد</button></div>
    <div class="field"><label for="mf">التعليمات</label><select id="mf">${Object.entries(FOOD).map(([k,v])=>`<option value="${k}" ${k===(m.food||"")?"selected":""}>${v||"بدون تعليمات"}</option>`).join("")}</select></div>
    <div class="two" id="durBox"><div class="field"><label for="ms">يبدأ من</label><input id="ms" type="date" value="${esc(m.start)}"></div>
    <div class="field"><label for="mdays">المدة بالأيام</label><input id="mdays" type="number" min="1" inputmode="numeric" value="${esc(m.days)}" placeholder="فارغ = مستمر"></div></div>
    <div class="field"><label for="mno">ملاحظات</label><input id="mno" value="${esc(m.notes)}" placeholder="اختياري"></div>
    ${!isNew?`<div class="set-item"><div><b>إيقاف مؤقت للدواء</b><small>لن تظهر جرعاته ولن يرن له منبّه</small></div><input type="checkbox" class="switch" id="mp" ${m.paused?"checked":""} aria-label="إيقاف مؤقت"></div>`:""}
    <p class="err" id="er" hidden></p>
    <button class="btn block" type="submit">حفظ الدواء</button>${del?del.html:""}`,
  (f,close)=>{ if(del)del.bind(f,close);
    // Hour, minute and AM/PM as three large lists: easier than the phone's clock picker and allows any minute.
    const drawT=()=>{ $("#tl").innerHTML=times.map((t,i)=>{ let [h,mi]=t.split(":").map(Number); const pm=h>=12; const h12=h%12||12;
        return `<div class="t" data-i="${i}"><span class="tn">${i+1}</span>
        <select data-p="h" aria-label="الساعة للموعد ${i+1}">${Array.from({length:12},(_,k)=>k+1).map(x=>`<option value="${x}" ${x===h12?"selected":""}>${x}</option>`).join("")}</select>
        <b>:</b>
        <select data-p="m" aria-label="الدقيقة للموعد ${i+1}">${Array.from({length:60},(_,k)=>k).map(x=>`<option value="${x}" ${x===mi?"selected":""}>${pad(x)}</option>`).join("")}</select>
        <select data-p="ap" aria-label="صباحاً أو مساءً للموعد ${i+1}"><option value="am" ${!pm?"selected":""}>صباحاً</option><option value="pm" ${pm?"selected":""}>مساءً</option></select>
        ${times.length>1?`<button type="button" class="icon-btn" data-rm="${i}" aria-label="حذف الموعد">${I.x}</button>`:""}</div>`;}).join("");
      $("#tl").querySelectorAll(".t").forEach(row=>row.onchange=()=>{ const g=p=>row.querySelector(`[data-p="${p}"]`).value;
        let h=Number(g("h"))%12; if(g("ap")==="pm") h+=12; times[row.dataset.i]=pad(h)+":"+pad(Number(g("m"))); });
      $("#tl").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{times.splice(b.dataset.rm,1);drawT();}); };
    drawT();
    const drawK=()=>{ $("#kind").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String((b.dataset.k==="1")===prn)));
      $("#prnBox").hidden=!prn; $("#schedBox").hidden=prn; $("#durBox").hidden=prn; };
    drawK(); $("#kind").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;prn=b.dataset.k==="1";drawK();};
    $("#addT").onclick=()=>{const last=times[times.length-1]||"08:00";const n=(toMin(last)+240)%1440;times.push(pad(Math.floor(n/60))+":"+pad(n%60));drawT();};
    $("#pre").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;times=b.dataset.p.split(",");drawT();};
    f.onsubmit=e=>{e.preventDefault(); const er=$("#er");
      const name=$("#mn").value.trim(); const clean=[...new Set(times.filter(Boolean))].sort();
      if(!name){er.textContent="اكتب اسم الدواء";er.hidden=false;return;}
      if(!prn&&!clean.length){er.textContent="أضف موعداً واحداً على الأقل";er.hidden=false;return;}
      const num=v=>v?String(Math.max(1,parseInt(v)||1)):"";
      Object.assign(m,{prn,gapH:prn?num($("#mg").value):"",maxDay:prn?num($("#mx").value):""});
      Object.assign(m,{name,dose:$("#md").value.trim(),times:prn?[]:clean,food:$("#mf").value,start:$("#ms").value||today(),days:$("#mdays").value?String(Math.max(1,parseInt($("#mdays").value))):"",notes:$("#mno").value.trim()});
      const mp=$("#mp"); if(mp) m.paused=mp.checked;
      if(isNew){m.id=uid();S.meds.push(m);} save(); close(); render(); toast(isNew?"تمت إضافة الدواء ومواعيده":"تم الحفظ"); unlockAudio();};
  });
}

function welcome(){
  sheet(`<div style="display:grid;gap:6px;justify-items:center;text-align:center;padding-top:6px">${pill(56,"var(--teal)")}<h2>أهلاً بك في أدويتي</h2><p class="hint">سجّل أطباءك ووصفاتهم وأدويتك، وسينبّهك التطبيق بصوت عند كل جرعة. كل البيانات تبقى على هاتفك فقط.</p></div>
    <div class="field"><label for="wn">اسمك</label><input id="wn" placeholder="اكتب اسمك" autocomplete="name"></div>
    <label class="set-item" style="cursor:pointer"><div><b>أضف بيانات تجريبية</b><small>طبيب ووصفة ودواءان للتجربة، يمكنك حذفها لاحقاً</small></div><input type="checkbox" class="switch" id="wdemo"></label>
    <button class="btn block" type="submit">ابدأ</button>`,
  (f,close)=>{f.onsubmit=e=>{e.preventDefault(); S.profile.name=$("#wn").value.trim();
    if($("#wdemo").checked) seedDemo(); save(); close(); unlockAudio(); render();
    if(notifySupported()&&Notification.permission==="default") try{Notification.requestPermission();}catch(_){} };});
}
function seedDemo(){
  const d1={id:uid(),name:"منى عبد الرحمن",specialty:"قلب وأوعية دموية",phone:"0223456789",clinic:"عيادة المعادي",demo:1};
  const d2={id:uid(),name:"كريم فوزي",specialty:"سكر وغدد صماء",phone:"",clinic:"",demo:1};
  const r1={id:uid(),doctorId:d1.id,date:addDays(today(),-10),title:"متابعة ضغط"};
  const r2={id:uid(),doctorId:d2.id,date:addDays(today(),-3),title:""};
  S.doctors.push(d1,d2); S.rx.push(r1,r2);
  S.meds.push({id:uid(),rxId:r1.id,name:"دواء الضغط (مثال)",dose:"قرص واحد",times:["09:00"],food:"after",start:addDays(today(),-10),days:"",notes:""},
    {id:uid(),rxId:r1.id,name:"أسبرين 81 (مثال)",dose:"قرص واحد",times:["14:00"],food:"after",start:addDays(today(),-10),days:"",notes:""},
    {id:uid(),rxId:r2.id,name:"ميتفورمين 500 (مثال)",dose:"قرص واحد",times:["08:00","20:00"],food:"with",start:addDays(today(),-3),days:"30",notes:""},
    {id:uid(),rxId:"",name:"فيتامين د (مثال)",dose:"كبسولة واحدة",times:["10:00"],food:"with",start:today(),days:"",notes:""},
    {id:uid(),rxId:"",name:"باراسيتامول 500 (مثال)",dose:"قرص واحد",times:[],prn:true,gapH:"6",maxDay:"4",food:"after",start:today(),days:"",notes:"للصداع"});
}

/* ---------- toast ---------- */
let tT=null;
function toast(msg){ let t=$("#toast"); if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.innerHTML=`<span>${esc(msg)}</span>`; t.hidden=false; clearTimeout(tT); tT=setTimeout(()=>{t.hidden=true;},2400); }

/* ---------- boot ---------- */
render();
if(!S.profile.name && !S.meds.length) welcome();
if(S.settings.wake) setWake(true);
setInterval(()=>{checkDue();},10000);
setInterval(()=>{ if(!document.querySelector(".scrim") && tab!=="more") render(); else renderTop(); },60000);
setTimeout(checkDue,1500);
try{ if("speechSynthesis" in window) speechSynthesis.getVoices(); }catch(e){}
})();
</script>

</body>
</html>
